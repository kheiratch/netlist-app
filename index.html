<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NETLIST - Vos listes de films, séries & animés</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone pour le JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome pour les icônes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-glow: rgba(59, 130, 246, 0.4);
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #080b12;
      color: #e2e8f0;
      min-height: 100vh;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 9999px;
    }
    .accent-bg { background-color: var(--accent) !important; }
    .accent-bg-hover:hover { background-color: var(--accent-hover) !important; }
    .accent-text { color: var(--accent) !important; }
    .accent-border { border-color: var(--accent) !important; }
    .accent-ring:focus { --tw-ring-color: var(--accent) !important; }
    .accent-glow { box-shadow: 0 0 20px var(--accent-glow) !important; }
  </style>
</head>
<body class="custom-scrollbar selection:bg-blue-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const TMDB_API_KEY = "d9cfe0d6babb39d719fc44ddbd935727";
    const TMDB_BASE_URL = "https://api.themoviedb.org/3";
    const TMDB_IMG_URL = "https://image.tmdb.org/t/p/w500";

    const PRESET_THEMES = [
      { name: "Bleu Électrique", hex: "#3b82f6", hover: "#2563eb", glow: "rgba(59, 130, 246, 0.4)" },
      { name: "Rouge Netflix", hex: "#e50914", hover: "#b80710", glow: "rgba(229, 9, 20, 0.4)" },
      { name: "Violet Cyber", hex: "#8b5cf6", hover: "#7c3aed", glow: "rgba(139, 92, 246, 0.4)" },
      { name: "Vert Émeraude", hex: "#10b981", hover: "#059669", glow: "rgba(16, 185, 129, 0.4)" },
      { name: "Cyan Futuriste", hex: "#06b6d4", hover: "#0891b2", glow: "rgba(6, 182, 212, 0.4)" },
      { name: "Rose Néon", hex: "#ec4899", hover: "#db2777", glow: "rgba(236, 72, 153, 0.4)" },
      { name: "Or / Doré", hex: "#eab308", hover: "#ca8a04", glow: "rgba(234, 179, 8, 0.4)" }
    ];

    const DEFAULT_PROFILES = [
      { id: "1", name: "Kero", avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" }
    ];

    const DEFAULT_WORKS = [
      {
        id: "w1",
        profileId: "1",
        tmdbId: 693134,
        title: "Dune : Deuxième Partie",
        category: "Films",
        status: "Terminé",
        year: "2024",
        poster: "https://image.tmdb.org/t/p/w500/8b8R8l88Qje9dn9OE8PY05Nxl1X.jpg",
        genres: ["Science-Fiction", "Aventure"],
        synopsis: "Paul Atreides s'unit à Chani et aux Fremen pour mener la révolte contre ceux qui ont anéanti sa famille.",
        rating: 9.2,
        detailedRating: { scenario: 9, visual: 10, sound: 10, acting: 9, emotion: 8 },
        providers: ["Canal+", "Apple TV"],
        createdAt: Date.now()
      }
    ];

    function App() {
      // Accent Color Theme State
      const [currentThemeHex, setCurrentThemeHex] = useState(() => {
        return localStorage.getItem("netlist_theme") || "#3b82f6";
      });

      // Profiles & Works State
      const [profiles, setProfiles] = useState(() => {
        const saved = localStorage.getItem("netlist_profiles");
        return saved ? JSON.parse(saved) : DEFAULT_PROFILES;
      });
      const [currentProfileId, setCurrentProfileId] = useState(() => {
        return localStorage.getItem("netlist_active_profile") || "1";
      });
      const [isSelectingProfile, setIsSelectingProfile] = useState(false);

      const [works, setWorks] = useState(() => {
        const saved = localStorage.getItem("netlist_works");
        return saved ? JSON.parse(saved) : DEFAULT_WORKS;
      });

      // Filter and Navigation State
      const [activeCategory, setActiveCategory] = useState("Toutes");
      const [statusFilter, setStatusFilter] = useState("Tous");
      const [searchQuery, setSearchQuery] = useState("");

      // Modals
      const [showSettings, setShowSettings] = useState(false);
      const [showAddModal, setShowAddModal] = useState(false);
      const [showDetailModal, setShowDetailModal] = useState(null);
      const [showChatModal, setShowChatModal] = useState(false);

      // Search & Autocomplete
      const [quickSearchInput, setQuickSearchInput] = useState("");
      const [quickResults, setQuickResults] = useState([]);
      const [isSearching, setIsSearching] = useState(false);

      // Chat Messages
      const [chatMessages, setChatMessages] = useState(() => {
        const saved = localStorage.getItem("netlist_chat");
        return saved ? JSON.parse(saved) : [
          { id: "m1", senderId: "1", senderName: "Kero", text: "Bienvenue sur NETLIST ! Partagez vos listes ici.", timestamp: Date.now() }
        ];
      });

      // Apply dynamic colors
      useEffect(() => {
        localStorage.setItem("netlist_theme", currentThemeHex);
        const root = document.documentElement;
        root.style.setProperty("--accent", currentThemeHex);
        root.style.setProperty("--accent-hover", currentThemeHex);
        root.style.setProperty("--accent-glow", `${currentThemeHex}66`);
      }, [currentThemeHex]);

      useEffect(() => {
        localStorage.setItem("netlist_profiles", JSON.stringify(profiles));
      }, [profiles]);

      useEffect(() => {
        localStorage.setItem("netlist_works", JSON.stringify(works));
      }, [works]);

      useEffect(() => {
        localStorage.setItem("netlist_chat", JSON.stringify(chatMessages));
      }, [chatMessages]);

      const currentProfile = useMemo(() => {
        return profiles.find(p => p.id === currentProfileId) || profiles[0];
      }, [profiles, currentProfileId]);

      // Debounced TMDB Quick Search
      useEffect(() => {
        if (!quickSearchInput.trim()) {
          setQuickResults([]);
          return;
        }
        const timer = setTimeout(async () => {
          setIsSearching(true);
          try {
            const res = await fetch(`${TMDB_BASE_URL}/search/multi?api_key=${TMDB_API_KEY}&language=fr-FR&query=${encodeURIComponent(quickSearchInput)}&include_adult=false`);
            const data = await res.json();
            const items = (data.results || []).filter(item => item.media_type === "movie" || item.media_type === "tv");
            setQuickResults(items.slice(0, 6));
          } catch (err) {
            console.error("Erreur TMDB:", err);
          } finally {
            setIsSearching(false);
          }
        }, 300);
        return () => clearTimeout(timer);
      }, [quickSearchInput]);

      const handleAddFromTmdb = async (tmdbItem) => {
        setQuickResults([]);
        setQuickSearchInput("");

        const isTv = tmdbItem.media_type === "tv";
        const title = isTv ? (tmdbItem.name || tmdbItem.original_name) : (tmdbItem.title || tmdbItem.original_title);
        const year = (isTv ? tmdbItem.first_air_date : tmdbItem.release_date || "").split("-")[0] || "";
        const poster = tmdbItem.poster_path ? `${TMDB_IMG_URL}${tmdbItem.poster_path}` : "";

        let seasonsCount = 1;
        let episodesCount = 12;
        let providersList = [];

        try {
          if (isTv) {
            const detRes = await fetch(`${TMDB_BASE_URL}/tv/${tmdbItem.id}?api_key=${TMDB_API_KEY}&language=fr-FR`);
            const det = await detRes.json();
            seasonsCount = det.number_of_seasons || 1;
            if (det.seasons && det.seasons[0]) {
              episodesCount = det.seasons[0].episode_count || 12;
            }
          }
          const provRes = await fetch(`${TMDB_BASE_URL}/${isTv ? 'tv' : 'movie'}/${tmdbItem.id}/watch/providers?api_key=${TMDB_API_KEY}`);
          const provData = await provRes.json();
          if (provData.results?.FR?.flatrate) {
            providersList = provData.results.FR.flatrate.map(p => p.provider_name);
          }
        } catch (e) {
          console.warn("Détails partiels:", e);
        }

        const newWork = {
          id: "w_" + Date.now(),
          profileId: currentProfileId,
          tmdbId: tmdbItem.id,
          title: `${title} (${year})`,
          category: isTv ? (tmdbItem.original_language === "ja" ? "Animés" : "Séries") : "Films",
          status: "En cours",
          year,
          poster,
          synopsis: tmdbItem.overview || "Aucun synopsis disponible.",
          rating: 0,
          currentSeason: 1,
          currentEpisode: 1,
          totalSeasons: seasonsCount,
          totalEpisodes: episodesCount,
          mangaTracking: false,
          mangaChapter: 1,
          providers: providersList,
          detailedRating: { scenario: 8, visual: 8, sound: 8, acting: 8, emotion: 8 },
          createdAt: Date.now()
        };

        setWorks(prev => [newWork, ...prev]);
        setShowDetailModal(newWork);
      };

      const filteredWorks = useMemo(() => {
        return works.filter(w => {
          if (w.profileId !== currentProfileId) return false;
          if (activeCategory !== "Toutes" && w.category !== activeCategory) return false;
          if (statusFilter !== "Tous" && w.status !== statusFilter) return false;
          if (searchQuery.trim() && !w.title.toLowerCase().includes(searchQuery.toLowerCase())) return false;
          return true;
        });
      }, [works, currentProfileId, activeCategory, statusFilter, searchQuery]);

      // Écran "Qui regarde ?"
      if (isSelectingProfile) {
        return (
          <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-6 text-white">
            <div className="flex flex-col items-center mb-8">
              <img src="logo.png" onError={(e) => { e.target.src = "logo.PNG"; }} alt="Logo" className="w-24 h-24 rounded-2xl mb-3 shadow-2xl object-cover" />
              <h1 className="text-3xl font-extrabold tracking-wider">NETLIST</h1>
              <p className="text-slate-400 mt-1">Qui regarde ?</p>
            </div>

            <div className="flex flex-wrap gap-8 justify-center max-w-2xl">
              {profiles.map(p => (
                <div key={p.id} onClick={() => { setCurrentProfileId(p.id); setIsSelectingProfile(false); }} className="group flex flex-col items-center cursor-pointer">
                  <div className="w-28 h-28 rounded-2xl overflow-hidden border-2 border-transparent group-hover:accent-border group-hover:scale-105 transition-all duration-300 shadow-xl relative">
                    <img src={p.avatar} alt={p.name} className="w-full h-full object-cover" />
                  </div>
                  <span className="mt-3 text-slate-300 group-hover:text-white font-medium text-lg">{p.name}</span>
                </div>
              ))}

              <div onClick={() => {
                const name = prompt("Nom du nouveau profil :");
                if (name && name.trim()) {
                  const newP = {
                    id: "p_" + Date.now(),
                    name: name.trim(),
                    avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${name.trim()}`
                  };
                  setProfiles(prev => [...prev, newP]);
                  setCurrentProfileId(newP.id);
                  setIsSelectingProfile(false);
                }
              }} className="flex flex-col items-center cursor-pointer group">
                <div className="w-28 h-28 rounded-2xl border-2 border-dashed border-slate-700 group-hover:accent-border flex items-center justify-center transition-all bg-slate-900/40">
                  <i className="fa-solid fa-plus text-3xl text-slate-500 group-hover:accent-text"></i>
                </div>
                <span className="mt-3 text-slate-400 group-hover:text-white font-medium text-lg">Ajouter</span>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#080b12] text-slate-200 flex flex-col">
          {/* HEADER / NAVIGATION */}
          <header className="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80 px-4 md:px-8 py-3">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              {/* Logo + Titre */}
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setIsSelectingProfile(true)}>
                <img src="logo.png" onError={(e) => { e.target.src = "logo.PNG"; }} alt="Logo" className="w-10 h-10 rounded-xl object-cover shadow-md" />
                <span className="font-extrabold text-xl tracking-wider text-white hidden sm:inline">NETLIST</span>
              </div>

              {/* Barre d'ajout rapide TMDB */}
              <div className="flex-1 max-w-xl relative">
                <div className="relative">
                  <i className="fa-solid fa-bolt absolute left-3.5 top-1/2 -translate-y-1/2 accent-text text-sm"></i>
                  <input
                    type="text"
                    value={quickSearchInput}
                    onChange={(e) => setQuickSearchInput(e.target.value)}
                    placeholder="Ajouter rapidement un film, série, animé..."
                    className="w-full bg-slate-900/90 text-sm rounded-xl pl-9 pr-4 py-2 border border-slate-700/80 focus:outline-none accent-border text-white placeholder-slate-400"
                  />
                  {isSearching && (
                    <i className="fa-solid fa-circle-notch fa-spin absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                  )}
                </div>

                {/* Suggestions automatiques */}
                {quickResults.length > 0 && (
                  <div className="absolute top-full left-0 right-0 mt-2 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl overflow-hidden z-50 divide-y divide-slate-800">
                    {quickResults.map(item => {
                      const title = item.title || item.name;
                      const year = (item.release_date || item.first_air_date || "").split("-")[0];
                      const poster = item.poster_path ? `${TMDB_IMG_URL}${item.poster_path}` : null;
                      return (
                        <div
                          key={item.id}
                          onClick={() => handleAddFromTmdb(item)}
                          className="flex items-center gap-3 p-2.5 hover:bg-slate-800/80 cursor-pointer transition"
                        >
                          {poster ? (
                            <img src={poster} className="w-9 h-12 rounded object-cover" />
                          ) : (
                            <div className="w-9 h-12 bg-slate-800 rounded flex items-center justify-center text-slate-500">
                              <i className="fa-solid fa-film"></i>
                            </div>
                          )}
                          <div className="flex-1 min-w-0">
                            <p className="text-white text-sm font-semibold truncate">{title}</p>
                            <p className="text-xs text-slate-400">{year} • {item.media_type === "tv" ? "Série / Animé" : "Film"}</p>
                          </div>
                          <span className="text-xs font-bold px-2 py-1 rounded accent-bg text-white">
                            + Ajouter
                          </span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              {/* Actions droites (Profil, Chat, Réglages Couleur) */}
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setShowChatModal(true)}
                  className="p-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white transition relative"
                  title="Discussion"
                >
                  <i className="fa-solid fa-comments"></i>
                </button>

                <button
                  onClick={() => setShowSettings(true)}
                  className="p-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white transition"
                  title="Paramètres de couleur et thème"
                >
                  <i className="fa-solid fa-palette accent-text"></i>
                </button>

                {/* Profil actif */}
                <div
                  onClick={() => setIsSelectingProfile(true)}
                  className="flex items-center gap-2 bg-slate-900 hover:bg-slate-800 p-1.5 pr-3 rounded-xl cursor-pointer border border-slate-800 transition"
                >
                  <img src={currentProfile.avatar} className="w-7 h-7 rounded-lg object-cover" />
                  <span className="text-sm font-semibold text-white hidden md:inline">{currentProfile.name}</span>
                  <i className="fa-solid fa-chevron-down text-xs text-slate-400 ml-1"></i>
                </div>
              </div>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 md:px-8 py-6">
            {/* Onglets Catégories */}
            <div className="flex flex-wrap items-center justify-between gap-4 mb-6">
              <div className="flex flex-wrap gap-2">
                {["Toutes", "Films", "Séries", "Animés"].map(cat => (
                  <button
                    key={cat}
                    onClick={() => setActiveCategory(cat)}
                    className={`px-4 py-2 rounded-xl text-sm font-bold transition-all ${
                      activeCategory === cat
                        ? "accent-bg text-white shadow-lg accent-glow"
                        : "bg-slate-900 text-slate-400 hover:text-white hover:bg-slate-800"
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              {/* Filtres de recherche interne */}
              <div className="flex items-center gap-3 flex-wrap">
                <select
                  value={statusFilter}
                  onChange={(e) => setStatusFilter(e.target.value)}
                  className="bg-slate-900 border border-slate-800 text-xs rounded-xl px-3 py-2 text-slate-300 focus:outline-none accent-border"
                >
                  <option value="Tous">Tous les statuts</option>
                  <option value="En cours">En cours</option>
                  <option value="Terminé">Terminé</option>
                  <option value="À voir">À voir</option>
                </select>

                <div className="relative">
                  <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Filtrer mes films..."
                    className="bg-slate-900 border border-slate-800 text-xs rounded-xl pl-8 pr-3 py-2 text-slate-300 focus:outline-none accent-border w-36 sm:w-48"
                  />
                </div>
              </div>
            </div>

            {/* GRILLE D'AFFICHES */}
            {filteredWorks.length === 0 ? (
              <div className="flex flex-col items-center justify-center py-20 text-center">
                <div className="w-16 h-16 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center mb-4 text-slate-500 text-2xl">
                  <i className="fa-solid fa-clapperboard"></i>
                </div>
                <h3 className="text-lg font-bold text-white mb-1">Aucune œuvre dans cette vue</h3>
                <p className="text-sm text-slate-400 max-w-sm mb-4">
                  Utilisez la barre en haut pour chercher et ajouter instantanément vos films ou séries préférés !
                </p>
              </div>
            ) : (
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
                {filteredWorks.map(w => (
                  <div
                    key={w.id}
                    onClick={() => setShowDetailModal(w)}
                    className="group relative bg-slate-900/60 rounded-2xl overflow-hidden border border-slate-800/80 hover:border-slate-600 transition-all duration-300 cursor-pointer flex flex-col hover:-translate-y-1 hover:shadow-2xl"
                  >
                    {/* Affiche */}
                    <div className="aspect-[2/3] w-full bg-slate-800 relative overflow-hidden">
                      {w.poster ? (
                        <img src={w.poster} alt={w.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                      ) : (
                        <div className="w-full h-full flex items-center justify-center text-slate-600">
                          <i className="fa-solid fa-image text-3xl"></i>
                        </div>
                      )}

                      {/* Badge Statut */}
                      <span className={`absolute top-2 left-2 text-[10px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-md shadow-md ${
                        w.status === "Terminé" ? "bg-emerald-500 text-white" :
                        w.status === "En cours" ? "accent-bg text-white" : "bg-amber-500 text-slate-950 font-bold"
                      }`}>
                        {w.status}
                      </span>

                      {/* Note */}
                      {w.rating > 0 && (
                        <span className="absolute bottom-2 right-2 bg-slate-950/80 backdrop-blur-md text-amber-400 font-extrabold text-xs px-2 py-1 rounded-md flex items-center gap-1 shadow">
                          <i className="fa-solid fa-star text-[10px]"></i>
                          {w.rating}/10
                        </span>
                      )}
                    </div>

                    {/* Titre & Épisodes */}
                    <div className="p-3 flex-1 flex flex-col justify-between">
                      <div>
                        <h4 className="font-bold text-white text-sm line-clamp-1 group-hover:accent-text transition-colors">{w.title}</h4>
                        <p className="text-xs text-slate-400 mt-0.5">{w.category}</p>
                      </div>

                      {/* Progression Saisons/Épisodes ou Manga */}
                      {(w.category === "Séries" || w.category === "Animés") && (
                        <div className="mt-2 pt-2 border-t border-slate-800 flex items-center justify-between text-xs text-slate-300">
                          <span>S{w.currentSeason || 1} • Ép.{w.currentEpisode || 1}</span>
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              setWorks(prev => prev.map(item => item.id === w.id ? { ...item, currentEpisode: (item.currentEpisode || 1) + 1 } : item));
                            }}
                            className="px-2 py-0.5 rounded bg-slate-800 hover:accent-bg text-slate-200 font-bold transition"
                            title="+1 épisode"
                          >
                            +Ép
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* MODAL RÉGLAGE THÈME & COULEUR */}
          {showSettings && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-md w-full shadow-2xl relative">
                <button
                  onClick={() => setShowSettings(false)}
                  className="absolute top-5 right-5 text-slate-400 hover:text-white text-lg"
                >
                  <i className="fa-solid fa-xmark"></i>
                </button>

                <h3 className="text-xl font-bold text-white mb-2 flex items-center gap-2">
                  <i className="fa-solid fa-palette accent-text"></i>
                  Personnaliser les couleurs
                </h3>
                <p className="text-xs text-slate-400 mb-6">
                  Choisissez la couleur principale pour les boutons, onglets, badges et lueurs de l'application.
                </p>

                {/* Nuancier Pré-défini */}
                <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Thèmes recommandés</label>
                <div className="grid grid-cols-2 gap-3 mb-6">
                  {PRESET_THEMES.map(theme => (
                    <button
                      key={theme.name}
                      onClick={() => setCurrentThemeHex(theme.hex)}
                      className={`flex items-center gap-3 p-3 rounded-2xl border transition-all text-left ${
                        currentThemeHex.toLowerCase() === theme.hex.toLowerCase()
                          ? "border-white bg-slate-800 shadow-lg"
                          : "border-slate-800 bg-slate-950/60 hover:border-slate-700"
                      }`}
                    >
                      <div className="w-5 h-5 rounded-full shadow" style={{ backgroundColor: theme.hex }}></div>
                      <span className="text-xs font-bold text-slate-200">{theme.name}</span>
                    </button>
                  ))}
                </div>

                {/* Sélecteur libre */}
                <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Choisir une couleur sur mesure</label>
                <div className="flex items-center gap-3 bg-slate-950 p-3 rounded-2xl border border-slate-800">
                  <input
                    type="color"
                    value={currentThemeHex}
                    onChange={(e) => setCurrentThemeHex(e.target.value)}
                    className="w-10 h-10 rounded-xl cursor-pointer bg-transparent border-0"
                  />
                  <div className="flex-1">
                    <span className="text-xs text-slate-400 block">Code Hexadécimal</span>
                    <input
                      type="text"
                      value={currentThemeHex}
                      onChange={(e) => setCurrentThemeHex(e.target.value)}
                      className="bg-transparent text-sm font-mono font-bold text-white focus:outline-none"
                    />
                  </div>
                </div>

                <button
                  onClick={() => setShowSettings(false)}
                  className="w-full mt-6 py-3 rounded-xl accent-bg text-white font-bold text-sm shadow-lg transition accent-glow"
                >
                  Appliquer & Enregistrer
                </button>
              </div>
            </div>
          )}

          {/* MODAL FICHE DÉTAIL & NOTATION (5 CRITÈRES) */}
          {showDetailModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-2xl w-full p-6 shadow-2xl relative my-8">
                <button
                  onClick={() => setShowDetailModal(null)}
                  className="absolute top-5 right-5 text-slate-400 hover:text-white text-lg z-10"
                >
                  <i className="fa-solid fa-xmark"></i>
                </button>

                <div className="flex flex-col sm:flex-row gap-6">
                  {/* Affiche */}
                  <div className="w-full sm:w-44 flex-shrink-0">
                    <img src={showDetailModal.poster} className="w-full rounded-2xl shadow-xl border border-slate-800 aspect-[2/3] object-cover" />
                    
                    {/* Plateformes */}
                    {showDetailModal.providers?.length > 0 && (
                      <div className="mt-3">
                        <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Où regarder</span>
                        <div className="flex flex-wrap gap-1">
                          {showDetailModal.providers.map(pr => (
                            <span key={pr} className="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-slate-200">{pr}</span>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Infos */}
                  <div className="flex-1 flex flex-col justify-between">
                    <div>
                      <h3 className="text-xl font-extrabold text-white">{showDetailModal.title}</h3>
                      <p className="text-xs text-slate-400 mt-1">{showDetailModal.category} • {showDetailModal.year}</p>

                      <div className="mt-4">
                        <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Statut</label>
                        <select
                          value={showDetailModal.status}
                          onChange={(e) => {
                            const updated = { ...showDetailModal, status: e.target.value };
                            setShowDetailModal(updated);
                            setWorks(prev => prev.map(w => w.id === updated.id ? updated : w));
                          }}
                          className="bg-slate-950 border border-slate-800 text-xs rounded-xl px-3 py-2 text-white accent-border focus:outline-none"
                        >
                          <option value="À voir">À voir</option>
                          <option value="En cours">En cours</option>
                          <option value="Terminé">Terminé</option>
                        </select>
                      </div>

                      {/* Saisons / Épisodes si Série/Animé */}
                      {(showDetailModal.category === "Séries" || showDetailModal.category === "Animés") && (
                        <div className="grid grid-cols-2 gap-3 mt-4">
                          <div>
                            <label className="text-[10px] font-bold text-slate-400 uppercase">Saison actuelle</label>
                            <input
                              type="number"
                              min="1"
                              value={showDetailModal.currentSeason || 1}
                              onChange={(e) => {
                                const updated = { ...showDetailModal, currentSeason: parseInt(e.target.value) || 1 };
                                setShowDetailModal(updated);
                                setWorks(prev => prev.map(w => w.id === updated.id ? updated : w));
                              }}
                              className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-white"
                            />
                          </div>
                          <div>
                            <label className="text-[10px] font-bold text-slate-400 uppercase">Épisode actuel</label>
                            <input
                              type="number"
                              min="1"
                              value={showDetailModal.currentEpisode || 1}
                              onChange={(e) => {
                                const updated = { ...showDetailModal, currentEpisode: parseInt(e.target.value) || 1 };
                                setShowDetailModal(updated);
                                setWorks(prev => prev.map(w => w.id === updated.id ? updated : w));
                              }}
                              className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-white"
                            />
                          </div>
                        </div>
                      )}

                      <div className="mt-4">
                        <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Synopsis</label>
                        <p className="text-xs text-slate-300 leading-relaxed max-h-28 overflow-y-auto custom-scrollbar">
                          {showDetailModal.synopsis}
                        </p>
                      </div>
                    </div>

                    {/* Grille de Notation 5 Critères */}
                    <div className="mt-6 pt-4 border-t border-slate-800">
                      <div className="flex items-center justify-between mb-3">
                        <span className="text-xs font-bold uppercase tracking-wider text-slate-300">Notes détaillées</span>
                        <span className="accent-text font-black text-sm">Moyenne : {showDetailModal.rating || 0}/10</span>
                      </div>

                      <div className="grid grid-cols-3 sm:grid-cols-5 gap-2">
                        {[
                          { key: "scenario", label: "Scénario" },
                          { key: "visual", label: "Visuel" },
                          { key: "sound", label: "Musique" },
                          { key: "acting", label: "Acteurs" },
                          { key: "emotion", label: "Émotion" }
                        ].map(crit => (
                          <div key={crit.key} className="bg-slate-950 p-2 rounded-xl border border-slate-800">
                            <span className="text-[10px] text-slate-400 block text-center truncate">{crit.label}</span>
                            <select
                              value={showDetailModal.detailedRating?.[crit.key] || 8}
                              onChange={(e) => {
                                const val = parseFloat(e.target.value);
                                const newDetails = { ...(showDetailModal.detailedRating || {}), [crit.key]: val };
                                const values = Object.values(newDetails);
                                const avg = (values.reduce((a, b) => a + b, 0) / values.length).toFixed(1);
                                const updated = { ...showDetailModal, detailedRating: newDetails, rating: parseFloat(avg) };
                                setShowDetailModal(updated);
                                setWorks(prev => prev.map(w => w.id === updated.id ? updated : w));
                              }}
                              className="w-full bg-transparent text-center font-bold text-xs text-white mt-1 focus:outline-none"
                            >
                              {[...Array(10)].map((_, i) => (
                                <option key={i+1} value={i+1} className="bg-slate-900">{i+1}</option>
                              ))}
                            </select>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Bouton Supprimer */}
                    <div className="mt-6 flex justify-end">
                      <button
                        onClick={() => {
                          if (confirm("Supprimer cette œuvre de votre liste ?")) {
                            setWorks(prev => prev.filter(w => w.id !== showDetailModal.id));
                            setShowDetailModal(null);
                          }
                        }}
                        className="text-xs text-rose-500 hover:text-rose-400 font-semibold"
                      >
                        <i className="fa-solid fa-trash mr-1"></i> Supprimer de ma liste
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL DISCUSSION / CHAT INTER-PROFILS */}
          {showChatModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full h-[550px] shadow-2xl flex flex-col overflow-hidden relative">
                {/* Header chat */}
                <div className="p-4 border-b border-slate-800 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <i className="fa-solid fa-comments accent-text"></i>
                    <h3 className="font-bold text-white text-sm">Discussion entre profils</h3>
                  </div>
                  <button onClick={() => setShowChatModal(false)} className="text-slate-400 hover:text-white">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                {/* Messages list */}
                <div className="flex-1 p-4 overflow-y-auto space-y-3 custom-scrollbar">
                  {chatMessages.map(m => {
                    const isMe = m.senderId === currentProfileId;
                    return (
                      <div key={m.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                        <span className="text-[10px] text-slate-500 mb-1">{m.senderName}</span>
                        <div className={`p-3 rounded-2xl text-xs max-w-[80%] ${isMe ? 'accent-bg text-white' : 'bg-slate-800 text-slate-200'}`}>
                          {m.text}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Input text */}
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const input = e.target.elements.msg;
                    if (input.value.trim()) {
                      const newMsg = {
                        id: "m_" + Date.now(),
                        senderId: currentProfileId,
                        senderName: currentProfile.name,
                        text: input.value.trim(),
                        timestamp: Date.now()
                      };
                      setChatMessages(prev => [...prev, newMsg]);
                      input.value = "";
                    }
                  }}
                  className="p-3 border-t border-slate-800 flex gap-2"
                >
                  <input
                    name="msg"
                    type="text"
                    placeholder="Écrivez un message..."
                    className="flex-1 bg-slate-950 border border-slate-800 text-xs rounded-xl px-3 py-2 text-white focus:outline-none accent-border"
                  />
                  <button type="submit" className="px-4 py-2 rounded-xl accent-bg text-white text-xs font-bold">
                    <i className="fa-solid fa-paper-plane"></i>
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NETLIST - Vos listes, vos profils</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone pour le JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome pour les icônes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #07090e;
      color: #f1f5f9;
      min-height: 100vh;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0b0f19;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
    .glow-cyan {
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
    }
  </style>
</head>
<body class="custom-scrollbar selection:bg-blue-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const TMDB_API_KEY = "d9cfe0d6babb39d719fc44ddbd935727";
    const TMDB_BASE_URL = "https://api.themoviedb.org/3";
    const TMDB_IMG_URL = "https://image.tmdb.org/t/p/w500";

    const DEFAULT_PROFILES = [
      { id: "1", name: "Kero", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Kero" }
    ];

    const DEFAULT_WORKS = [
      {
        id: "w1",
        profileId: "1",
        tmdbId: 693134,
        title: "Dune : Deuxième partie",
        category: "Films",
        status: "Terminé",
        year: "2024",
        releaseDate: "2024-02-28",
        poster: "https://image.tmdb.org/t/p/w500/8b8R8l88Qje9dn9OE8PY05Nxl1X.jpg",
        genres: ["Science-Fiction", "Aventure"],
        synopsis: "Paul Atreides s'unit à Chani et aux Fremen pour mener la révolte contre ceux qui ont anéanti sa famille.",
        rating: 8.1,
        tmdbRating: 8.1,
        detailedRating: { scenario: 8, visual: 9, sound: 9, acting: 8, emotion: 8 },
        providers: ["Canal+", "Apple TV"],
        createdAt: 1710000000000
      },
      {
        id: "w2",
        profileId: "1",
        tmdbId: 114479,
        title: "L'Odyssée",
        category: "Films",
        status: "À voir / lire",
        year: "2026",
        releaseDate: "2026-06-15",
        poster: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg",
        genres: ["Aventure", "Drame"],
        synopsis: "Vingt ans après son départ pour la guerre de Troie, le roi Ulysse rentre enfin à Ithaque.",
        rating: 8.0,
        tmdbRating: 8.0,
        detailedRating: { scenario: 8, visual: 8, sound: 8, acting: 8, emotion: 8 },
        providers: ["Non spécifié / VOD"],
        createdAt: 1710500000000
      },
      {
        id: "w3",
        profileId: "1",
        tmdbId: 46260,
        title: "Naruto (2002)",
        category: "Animés",
        status: "Terminé",
        year: "2002",
        releaseDate: "2002-10-03",
        poster: "https://image.tmdb.org/t/p/w500/vauCO83s14p4eM19g46rG35m1gX.jpg",
        genres: ["Animation", "Action"],
        synopsis: "Dans le village de Konoha vit Naruto, un jeune garçon détesté et craint des villageois...",
        rating: 8.4,
        tmdbRating: 8.4,
        detailedRating: { scenario: 8, visual: 8, sound: 8, acting: 8, emotion: 8 },
        providers: ["Netflix", "Prime Video", "ADN"],
        mangaTracking: true,
        mangaChapter: 245,
        currentSeason: 1,
        currentEpisode: 1,
        createdAt: 1709000000000
      }
    ];

    function App() {
      // Profiles
      const [profiles, setProfiles] = useState(() => {
        const saved = localStorage.getItem("netlist_profiles");
        return saved ? JSON.parse(saved) : DEFAULT_PROFILES;
      });
      const [currentProfileId, setCurrentProfileId] = useState(() => {
        return localStorage.getItem("netlist_active_profile") || "1";
      });
      const [showProfileMenu, setShowProfileMenu] = useState(false);

      // Works
      const [works, setWorks] = useState(() => {
        const saved = localStorage.getItem("netlist_works");
        return saved ? JSON.parse(saved) : DEFAULT_WORKS;
      });

      // Filter & Sort
      const [activeCategory, setActiveCategory] = useState("Toutes");
      const [statusFilter, setStatusFilter] = useState("Tous les statuts");
      const [genreFilter, setGenreFilter] = useState("Tous les genres");
      const [sortBy, setSortBy] = useState("date_desc");
      const [searchQuery, setSearchQuery] = useState("");

      // Multi-select state
      const [isSelectMode, setIsSelectMode] = useState(false);
      const [selectedIds, setSelectedIds] = useState([]);

      // Search & Autocomplete
      const [quickSearchInput, setQuickSearchInput] = useState("");
      const [quickResults, setQuickResults] = useState([]);
      const [isSearching, setIsSearching] = useState(false);

      // Modals
      const [showDetailModal, setShowDetailModal] = useState(null);
      const [showChatModal, setShowChatModal] = useState(false);

      // Chat Messages
      const [chatMessages, setChatMessages] = useState(() => {
        const saved = localStorage.getItem("netlist_chat");
        return saved ? JSON.parse(saved) : [
          { id: "m1", senderId: "1", senderName: "Kero", text: "Bienvenue sur NETLIST ! Partagez vos listes ici.", timestamp: Date.now() }
        ];
      });

      // Save to localStorage
      useEffect(() => {
        localStorage.setItem("netlist_profiles", JSON.stringify(profiles));
      }, [profiles]);
      useEffect(() => {
        localStorage.setItem("netlist_works", JSON.stringify(works));
      }, [works]);
      useEffect(() => {
        localStorage.setItem("netlist_chat", JSON.stringify(chatMessages));
      }, [chatMessages]);

      const currentProfile = useMemo(() => {
        return profiles.find(p => p.id === currentProfileId) || profiles[0];
      }, [profiles, currentProfileId]);

      // Categories Count
      const counts = useMemo(() => {
        const userWorks = works.filter(w => w.profileId === currentProfileId);
        return {
          total: userWorks.length,
          films: userWorks.filter(w => w.category === "Films").length,
          series: userWorks.filter(w => w.category === "Séries").length,
          animes: userWorks.filter(w => w.category === "Animés").length,
        };
      }, [works, currentProfileId]);

      // Debounced Quick Search via TMDB
      useEffect(() => {
        if (!quickSearchInput.trim()) {
          setQuickResults([]);
          return;
        }
        const timer = setTimeout(async () => {
          setIsSearching(true);
          try {
            const res = await fetch(`${TMDB_BASE_URL}/search/multi?api_key=${TMDB_API_KEY}&language=fr-FR&query=${encodeURIComponent(quickSearchInput)}&include_adult=false`);
            const data = await res.json();
            const items = (data.results || []).filter(item => item.media_type === "movie" || item.media_type === "tv");
            setQuickResults(items.slice(0, 6));
          } catch (err) {
            console.error("Erreur TMDB:", err);
          } finally {
            setIsSearching(false);
          }
        }, 300);
        return () => clearTimeout(timer);
      }, [quickSearchInput]);

      // Add Item from TMDB
      const handleAddFromTmdb = async (tmdbItem) => {
        setQuickResults([]);
        setQuickSearchInput("");

        const isTv = tmdbItem.media_type === "tv";
        const title = isTv ? (tmdbItem.name || tmdbItem.original_name) : (tmdbItem.title || tmdbItem.original_title);
        const releaseDate = isTv ? tmdbItem.first_air_date : tmdbItem.release_date;
        const year = (releaseDate || "").split("-")[0] || "";
        const poster = tmdbItem.poster_path ? `${TMDB_IMG_URL}${tmdbItem.poster_path}` : "";

        let providersList = [];
        try {
          const provRes = await fetch(`${TMDB_BASE_URL}/${isTv ? 'tv' : 'movie'}/${tmdbItem.id}/watch/providers?api_key=${TMDB_API_KEY}`);
          const provData = await provRes.json();
          if (provData.results?.FR?.flatrate) {
            providersList = provData.results.FR.flatrate.map(p => p.provider_name);
          }
        } catch (e) {
          console.warn("Détails watch providers:", e);
        }

        const isAnime = isTv && tmdbItem.original_language === "ja";

        const newWork = {
          id: "w_" + Date.now(),
          profileId: currentProfileId,
          tmdbId: tmdbItem.id,
          title: `${title} (${year})`,
          category: isTv ? (isAnime ? "Animés" : "Séries") : "Films",
          status: "À voir / lire",
          year,
          releaseDate: releaseDate || "2024-01-01",
          poster,
          synopsis: tmdbItem.overview || "Aucun synopsis disponible.",
          rating: tmdbItem.vote_average ? parseFloat(tmdbItem.vote_average.toFixed(1)) : 8.0,
          tmdbRating: tmdbItem.vote_average ? parseFloat(tmdbItem.vote_average.toFixed(1)) : 8.0,
          currentSeason: 1,
          currentEpisode: 1,
          mangaTracking: false,
          mangaChapter: 1,
          providers: providersList.length > 0 ? providersList : ["Non spécifié / VOD"],
          detailedRating: { scenario: 8, visual: 8, sound: 8, acting: 8, emotion: 8 },
          createdAt: Date.now()
        };

        setWorks(prev => [newWork, ...prev]);
        setShowDetailModal(newWork);
      };

      // Filtered and Sorted Works
      const displayedWorks = useMemo(() => {
        let list = works.filter(w => w.profileId === currentProfileId);

        if (activeCategory !== "Toutes") {
          list = list.filter(w => w.category === activeCategory);
        }
        if (statusFilter !== "Tous les statuts") {
          list = list.filter(w => w.status === statusFilter);
        }
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          list = list.filter(w => w.title.toLowerCase().includes(q));
        }

        return list.sort((a, b) => {
          if (sortBy === "date_desc") return (b.createdAt || 0) - (a.createdAt || 0);
          if (sortBy === "release_desc") return (b.releaseDate || "").localeCompare(a.releaseDate || "");
          if (sortBy === "release_asc") return (a.releaseDate || "").localeCompare(b.releaseDate || "");
          if (sortBy === "rating_desc") return (b.rating || b.tmdbRating || 0) - (a.rating || a.tmdbRating || 0);
          if (sortBy === "title_asc") return a.title.localeCompare(b.title);
          return 0;
        });
      }, [works, currentProfileId, activeCategory, statusFilter, searchQuery, sortBy]);

      // Direct delete single item
      const handleDeleteWork = (e, workId) => {
        e.stopPropagation();
        if (confirm("Supprimer cette œuvre de votre liste ?")) {
          setWorks(prev => prev.filter(w => w.id !== workId));
          setSelectedIds(prev => prev.filter(id => id !== workId));
        }
      };

      // Bulk actions
      const handleToggleSelectAll = () => {
        if (selectedIds.length === displayedWorks.length) {
          setSelectedIds([]);
        } else {
          setSelectedIds(displayedWorks.map(w => w.id));
        }
      };

      const handleBulkDelete = () => {
        if (confirm(`Supprimer ces ${selectedIds.length} œuvre(s) de votre liste ?`)) {
          setWorks(prev => prev.filter(w => !selectedIds.includes(w.id)));
          setSelectedIds([]);
          setIsSelectMode(false);
        }
      };

      const handleBulkStatusChange = (newStatus) => {
        setWorks(prev => prev.map(w => selectedIds.includes(w.id) ? { ...w, status: newStatus } : w));
        setSelectedIds([]);
        setIsSelectMode(false);
      };

      return (
        <div className="min-h-screen bg-[#07090e] text-slate-200 flex flex-col">
          {/* HEADER EXACT BASE44 */}
          <header className="sticky top-0 z-40 bg-[#090d16]/95 backdrop-blur-md border-b border-slate-800/80 px-4 md:px-8 py-3.5">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              
              {/* Logo SVG officiel Base44 + Titre */}
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-sky-600 to-cyan-400 p-[1.5px] shadow-lg shadow-sky-500/20">
                  <div className="w-full h-full bg-[#0b1120] rounded-[14px] flex items-center justify-center">
                    <svg className="w-5 h-5 text-sky-400" viewBox="0 0 24 24" fill="currentColor">
                      <rect x="5" y="8" width="3" height="8" rx="1.5" />
                      <rect x="10.5" y="5" width="3" height="14" rx="1.5" />
                      <rect x="16" y="7" width="3" height="10" rx="1.5" />
                    </svg>
                  </div>
                </div>
                <div>
                  <h1 className="font-black text-xl tracking-wider text-white leading-none">NETLIST</h1>
                  <p className="text-[11px] text-slate-400 font-medium tracking-wide mt-0.5">Vos listes, vos profils</p>
                </div>
              </div>

              {/* Barre centrale d'ajout rapide TMDB */}
              <div className="flex-1 max-w-xl relative">
                <div className="relative">
                  <i className="fa-solid fa-bolt absolute left-3.5 top-1/2 -translate-y-1/2 text-amber-400 text-xs"></i>
                  <input
                    type="text"
                    value={quickSearchInput}
                    onChange={(e) => setQuickSearchInput(e.target.value)}
                    placeholder="Ajouter rapidement un film, série, animé..."
                    className="w-full bg-[#0c1222] border border-slate-800/90 text-sm rounded-xl pl-9 pr-4 py-2.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500/70 transition shadow-inner"
                  />
                  {isSearching && (
                    <i className="fa-solid fa-circle-notch fa-spin absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                  )}
                </div>

                {/* Dropdown Suggestions */}
                {quickResults.length > 0 && (
                  <div className="absolute top-full left-0 right-0 mt-2 bg-[#0c1322] border border-slate-800 rounded-2xl shadow-2xl overflow-hidden z-50 divide-y divide-slate-800/60">
                    {quickResults.map(item => {
                      const title = item.title || item.name;
                      const year = (item.release_date || item.first_air_date || "").split("-")[0];
                      const poster = item.poster_path ? `${TMDB_IMG_URL}${item.poster_path}` : null;
                      return (
                        <div
                          key={item.id}
                          onClick={() => handleAddFromTmdb(item)}
                          className="flex items-center gap-3 p-3 hover:bg-slate-800/70 cursor-pointer transition"
                        >
                          {poster ? (
                            <img src={poster} className="w-10 h-14 rounded-lg object-cover shadow" />
                          ) : (
                            <div className="w-10 h-14 bg-slate-800 rounded-lg flex items-center justify-center text-slate-500">
                              <i className="fa-solid fa-film"></i>
                            </div>
                          )}
                          <div className="flex-1 min-w-0">
                            <p className="text-white text-sm font-bold truncate">{title}</p>
                            <p className="text-xs text-slate-400">{year} • {item.media_type === "tv" ? "Série / Animé" : "Film"}</p>
                          </div>
                          <span className="text-xs font-semibold px-2.5 py-1 rounded-lg bg-sky-500/20 text-sky-400 border border-sky-500/30">
                            + Ajouter
                          </span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              {/* Menu Profil & Chat */}
              <div className="flex items-center gap-2 relative">
                <button
                  onClick={() => setShowChatModal(true)}
                  className="w-10 h-10 rounded-xl bg-[#0c1222] border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white hover:border-slate-700 transition"
                  title="Discussion"
                >
                  <i className="fa-solid fa-comments text-sm"></i>
                </button>

                {/* Profil dropdown */}
                <div
                  onClick={() => setShowProfileMenu(!showProfileMenu)}
                  className="flex items-center gap-2 bg-[#0c1222] hover:bg-slate-800/60 border border-slate-800 px-2.5 py-1.5 rounded-xl cursor-pointer transition"
                >
                  <img src={currentProfile.avatar} className="w-7 h-7 rounded-lg object-cover bg-slate-800" />
                  <span className="text-sm font-semibold text-white">{currentProfile.name}</span>
                  <i className="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
                </div>

                {/* Dropdown Profils */}
                {showProfileMenu && (
                  <div className="absolute top-full right-0 mt-2 w-48 bg-[#0c1322] border border-slate-800 rounded-2xl shadow-2xl p-2 z-50">
                    <div className="text-[10px] font-bold uppercase tracking-wider text-slate-500 px-3 py-1.5">Changer de profil</div>
                    {profiles.map(p => (
                      <div
                        key={p.id}
                        onClick={() => { setCurrentProfileId(p.id); setShowProfileMenu(false); }}
                        className={`flex items-center gap-2.5 px-3 py-2 rounded-xl cursor-pointer text-xs font-semibold transition ${p.id === currentProfileId ? 'bg-sky-500/20 text-sky-400' : 'text-slate-300 hover:bg-slate-800'}`}
                      >
                        <img src={p.avatar} className="w-6 h-6 rounded-md object-cover" />
                        <span className="truncate">{p.name}</span>
                      </div>
                    ))}
                    <div className="border-t border-slate-800 mt-2 pt-2">
                      <div
                        onClick={() => {
                          const name = prompt("Nom du nouveau profil :");
                          if (name && name.trim()) {
                            const newP = {
                              id: "p_" + Date.now(),
                              name: name.trim(),
                              avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${name.trim()}`
                            };
                            setProfiles(prev => [...prev, newP]);
                            setCurrentProfileId(newP.id);
                            setShowProfileMenu(false);
                          }
                        }}
                        className="flex items-center gap-2 px-3 py-2 rounded-xl cursor-pointer text-xs text-slate-400 hover:text-white hover:bg-slate-800"
                      >
                        <i className="fa-solid fa-plus text-xs"></i>
                        <span>Créer un profil</span>
                      </div>
                    </div>
                  </div>
                )}
              </div>

            </div>
          </header>

          {/* MAIN WRAPPER */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 md:px-8 py-6">

            {/* Onglets Catégories + Recommandations */}
            <div className="flex flex-wrap items-center justify-between gap-3 mb-6">
              <div className="flex flex-wrap items-center gap-2">
                {[
                  { id: "Toutes", label: "Toutes", count: counts.total, icon: "fa-layer-group" },
                  { id: "Films", label: "Films", count: counts.films, icon: "fa-film" },
                  { id: "Séries", label: "Séries", count: counts.series, icon: "fa-tv" },
                  { id: "Animés", label: "Animés", count: counts.animes, icon: "fa-sparkles" }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveCategory(tab.id)}
                    className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                      activeCategory === tab.id
                        ? "bg-[#131b2e] text-sky-400 border border-sky-500/40 shadow-sm"
                        : "bg-[#0c1222] text-slate-400 hover:text-white border border-slate-800/80"
                    }`}
                  >
                    <span>{tab.label}</span>
                    <span className={`px-1.5 py-0.5 rounded-md text-[10px] ${activeCategory === tab.id ? 'bg-sky-500 text-slate-950 font-black' : 'bg-slate-800 text-slate-400'}`}>
                      {tab.count}
                    </span>
                  </button>
                ))}

                <button className="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold bg-[#0c1222] text-amber-400 border border-slate-800/80 hover:border-amber-400/40 transition">
                  <i className="fa-solid fa-wand-magic-sparkles"></i>
                  <span>Recommandations</span>
                </button>
              </div>

              {/* Actions de sélection groupée */}
              <div className="flex items-center gap-2">
                <button
                  onClick={() => {
                    setIsSelectMode(!isSelectMode);
                    setSelectedIds([]);
                  }}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition ${
                    isSelectMode ? "bg-sky-500 text-slate-950 border-sky-400" : "bg-[#0c1222] text-slate-300 border-slate-800 hover:border-slate-700"
                  }`}
                >
                  <i className="fa-solid fa-list-check mr-1.5"></i>
                  {isSelectMode ? "Annuler sélection" : "Sélectionner"}
                </button>
              </div>
            </div>

            {/* Barre de filtres & Tri & Recherche interne */}
            <div className="flex flex-wrap items-center justify-between gap-3 mb-6 bg-[#0c1222]/60 p-3 rounded-2xl border border-slate-800/80">
              {/* Recherche par titre */}
              <div className="relative flex-1 min-w-[200px] max-w-sm">
                <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Filtrer ma liste..."
                  className="w-full bg-[#07090e] border border-slate-800 text-xs rounded-xl pl-8 pr-3 py-2 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500"
                />
              </div>

              {/* Filtres déroulants et Tri */}
              <div className="flex items-center gap-2 flex-wrap">
                {/* Statuts */}
                <select
                  value={statusFilter}
                  onChange={(e) => setStatusFilter(e.target.value)}
                  className="bg-[#07090e] border border-slate-800 text-xs rounded-xl px-3 py-2 text-slate-300 focus:outline-none"
                >
                  <option value="Tous les statuts">Tous les statuts</option>
                  <option value="En cours">En cours</option>
                  <option value="Terminé">Terminé</option>
                  <option value="À voir / lire">À voir / lire</option>
                </select>

                {/* Tri */}
                <select
                  value={sortBy}
                  onChange={(e) => setSortBy(e.target.value)}
                  className="bg-[#07090e] border border-slate-800 text-xs rounded-xl px-3 py-2 text-sky-400 font-semibold focus:outline-none"
                >
                  <option value="date_desc">Ajout récent</option>
                  <option value="release_desc">Sortie : Plus récent</option>
                  <option value="release_asc">Sortie : Plus ancien</option>
                  <option value="rating_desc">Note TMDB / Moyenne</option>
                  <option value="title_asc">Titre (A à Z)</option>
                </select>
              </div>
            </div>

            {/* Barre flottante si mode sélection actif */}
            {isSelectMode && (
              <div className="sticky top-20 z-30 mb-6 bg-[#0c1322] border border-sky-500/40 rounded-2xl p-3 flex items-center justify-between shadow-2xl flex-wrap gap-2">
                <div className="flex items-center gap-3">
                  <button
                    onClick={handleToggleSelectAll}
                    className="text-xs font-bold px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white transition"
                  >
                    {selectedIds.length === displayedWorks.length ? "Tout désélectionner" : "Tout sélectionner"}
                  </button>
                  <span className="text-xs text-sky-400 font-semibold">
                    {selectedIds.length} sélectionné(s)
                  </span>
                </div>

                {selectedIds.length > 0 && (
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => handleBulkStatusChange("Terminé")}
                      className="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30"
                    >
                      Marquer Terminé
                    </button>
                    <button
                      onClick={() => handleBulkStatusChange("En cours")}
                      className="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-sky-500/20 text-sky-400 border border-sky-500/30"
                    >
                      Marquer En cours
                    </button>
                    <button
                      onClick={handleBulkDelete}
                      className="text-xs font-bold px-3 py-1.5 rounded-lg bg-rose-500/20 text-rose-400 border border-rose-500/40 hover:bg-rose-500 hover:text-white transition"
                    >
                      <i className="fa-solid fa-trash mr-1"></i> Supprimer ({selectedIds.length})
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* GRILLE D'AFFICHES (Exactement comme Base44) */}
            {displayedWorks.length === 0 ? (
              <div className="flex flex-col items-center justify-center py-20 text-center">
                <div className="w-14 h-14 rounded-2xl bg-[#0c1222] border border-slate-800 flex items-center justify-center mb-3 text-slate-500 text-xl">
                  <i className="fa-solid fa-clapperboard"></i>
                </div>
                <h3 className="text-base font-bold text-white mb-1">Aucune œuvre trouvée</h3>
                <p className="text-xs text-slate-400 max-w-sm">
                  Utilisez la barre du haut avec l'éclair pour ajouter vos films ou séries.
                </p>
              </div>
            ) : (
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
                {displayedWorks.map(w => {
                  const isSelected = selectedIds.includes(w.id);
                  return (
                    <div
                      key={w.id}
                      onClick={() => {
                        if (isSelectMode) {
                          setSelectedIds(prev => isSelected ? prev.filter(id => id !== w.id) : [...prev, w.id]);
                        } else {
                          setShowDetailModal(w);
                        }
                      }}
                      className={`group relative bg-[#0c1222] rounded-2xl overflow-hidden border transition-all duration-300 cursor-pointer flex flex-col hover:-translate-y-1 hover:shadow-2xl ${
                        isSelected ? 'border-sky-400 ring-2 ring-sky-400/50' : 'border-slate-800/80 hover:border-slate-600'
                      }`}
                    >
                      {/* Affiche */}
                      <div className="aspect-[2/3] w-full bg-slate-900 relative overflow-hidden">
                        {w.poster ? (
                          <img src={w.poster} alt={w.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                        ) : (
                          <div className="w-full h-full flex items-center justify-center text-slate-600">
                            <i className="fa-solid fa-image text-3xl"></i>
                          </div>
                        )}

                        {/* Case de sélection (si mode actif) */}
                        {isSelectMode && (
                          <div className="absolute top-2 left-2 z-20">
                            <input
                              type="checkbox"
                              checked={isSelected}
                              onChange={() => {}}
                              className="w-5 h-5 rounded text-sky-500 bg-slate-900 border-slate-700"
                            />
                          </div>
                        )}

                        {/* Badge de Type / Catégorie en haut à gauche */}
                        {!isSelectMode && (
                          <div className="absolute top-2.5 left-2.5 flex items-center gap-1.5 z-10">
                            <span className="bg-slate-950/80 backdrop-blur-md text-[10px] font-bold text-slate-200 px-2 py-0.5 rounded-md border border-slate-700/50">
                              <i className={`fa-solid ${w.category === 'Films' ? 'fa-film' : w.category === 'Animés' ? 'fa-sparkles' : 'fa-tv'} mr-1 text-[9px]`}></i>
                              {w.category === 'Films' ? 'Film' : w.category === 'Animés' ? 'Animé' : 'Série'}
                            </span>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md backdrop-blur-md ${
                              w.status === "Terminé" ? "bg-emerald-500/90 text-white" :
                              w.status === "En cours" ? "bg-sky-500/90 text-white" : "bg-amber-500/90 text-slate-950"
                            }`}>
                              {w.status}
                            </span>
                          </div>
                        )}

                        {/* BOUTON SUPPRIMER DIRECT AU SURVOL (En haut à droite) */}
                        {!isSelectMode && (
                          <button
                            onClick={(e) => handleDeleteWork(e, w.id)}
                            className="absolute top-2.5 right-2.5 w-7 h-7 rounded-lg bg-rose-950/80 border border-rose-500/50 text-rose-400 flex items-center justify-center opacity-0 group-hover:opacity-100 hover:bg-rose-600 hover:text-white transition-all z-20 shadow-lg"
                            title="Supprimer directement"
                          >
                            <i className="fa-solid fa-trash-can text-xs"></i>
                          </button>
                        )}

                        {/* Note étoilée en bas */}
                        <div className="absolute bottom-2 left-2 z-10">
                          <span className="bg-[#090d16]/90 backdrop-blur-md text-amber-400 font-extrabold text-[11px] px-2 py-0.5 rounded-md flex items-center gap-1 border border-amber-400/20">
                            <i className="fa-solid fa-star text-[9px]"></i>
                            {w.rating || w.tmdbRating || 8.0}
                          </span>
                        </div>
                      </div>

                      {/* Titre & Épisodes */}
                      <div className="p-3 flex-1 flex flex-col justify-between">
                        <div>
                          <h4 className="font-bold text-white text-xs line-clamp-1 group-hover:text-sky-400 transition-colors">
                            {w.title}
                          </h4>
                          <p className="text-[10px] text-slate-400 mt-0.5">
                            {w.category} • {w.year}
                          </p>
                        </div>

                        {/* Compteur d'épisodes si série/animé */}
                        {(w.category === "Séries" || w.category === "Animés") && (
                          <div className="mt-2.5 pt-2 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-300">
                            <span>S{w.currentSeason || 1} • Ép.{w.currentEpisode || 1}</span>
                            <button
                              onClick={(e) => {
                                e.stopPropagation();
                                setWorks(prev => prev.map(item => item.id === w.id ? { ...item, currentEpisode: (item.currentEpisode || 1) + 1 } : item));
                              }}
                              className="px-2 py-0.5 rounded bg-slate-800 hover:bg-sky-500 hover:text-white text-slate-300 font-bold transition text-[10px]"
                              title="+1 épisode"
                            >
                              +Ép
                            </button>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </main>

          {/* MODALE DÉTAILLÉE BASE44 AVEC CONDITION STRICTE POUR LE MANGA */}
          {showDetailModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-[#0c1222] border border-slate-800 rounded-3xl max-w-2xl w-full p-6 shadow-2xl relative my-6 text-slate-200">
                <button
                  onClick={() => setShowDetailModal(null)}
                  className="absolute top-5 right-5 text-slate-400 hover:text-white text-lg z-10"
                >
                  <i className="fa-solid fa-xmark"></i>
                </button>

                <div className="flex flex-col sm:flex-row gap-6">
                  {/* Affiche & VOD */}
                  <div className="w-full sm:w-44 flex-shrink-0">
                    <img src={showDetailModal.poster} className="w-full rounded-2xl shadow-xl border border-slate-800 aspect-[2/3] object-cover" />
                    
                    <div className="mt-3">
                      <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">OÙ REGARDER</span>
                      <div className="flex flex-wrap gap-1">
                        {showDetailModal.providers?.map(pr => (
                          <span key={pr} className="text-[10px] bg-[#141d33] border border-slate-800 px-2 py-0.5 rounded text-slate-300">{pr}</span>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Formulaire & Notation */}
                  <div className="flex-1 flex flex-col justify-between">
                    <div>
                      <div className="flex items-center justify-between">
                        <div>
                          <h3 className="text-xl font-black text-white">{showDetailModal.title}</h3>
                          <p className="text-xs text-slate-400 mt-0.5">{showDetailModal.category} • {showDetailModal.year}</p>
                        </div>
                        <span className="bg-amber-400/20 text-amber-400 border border-amber-400/30 text-xs font-bold px-2 py-1 rounded-md">
                          ★ {showDetailModal.rating || showDetailModal.tmdbRating || 8.0}/10
                        </span>
                      </div>

                      {/* SYNOPSIS avec liseré jaune exact de la capture */}
                      <div className="mt-4 border-l-2 border-amber-400 pl-3">
                        <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">SYNOPSIS</span>
                        <p className="text-xs text-slate-300 mt-1 max-h-24 overflow-y-auto custom-scrollbar leading-relaxed">
                          {showDetailModal.synopsis}
                        </p>
                      </div>

                      {/* Statut déroulant */}
                      <div className="mt-4">
                        <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Statut *</label>
                        <select
                          value={showDetailModal.status}
                          onChange={(e) => {
                            const updated = { ...showDetailModal, status: e.target.value };
                            setShowDetailModal(updated);
                            setWorks(prev => prev.map(w => w.id === updated.id ? updated : w));
                          }}
                          className="w-full bg-[#07090e] border border-slate-800 text-xs rounded-xl px-3 py-2 text-white focus:outline-none focus:border-sky-500"
                        >
                          <option value="À voir / lire">À voir / lire</option>
                          <option value="En cours">En cours</option>
                          <option value="Terminé">Terminé</option>
                        </select>
                      </div>

                      {/* CHECKBOX « JE LIS LE MANGA » : APPARAÎT UNIQUEMENT SI C'EST UN ANIMÉ */}
                      {showDetailModal.category === "Animés" && (
                        <div className="mt-3 bg-[#07090e] p-3 rounded-xl border border-slate-800 flex items-center justify-between">
                          <label className="flex items-center gap-2 cursor-pointer text-xs font-semibold text-slate-200">
                            <input
                              type="checkbox"
                              checked={!!showDetailModal.mangaTracking}
                              onChange={(e) => {
                                const updated = { ...showDetailModal, mangaTracking: e.target.checked };
                                setShowDetailModal(updated);
                                setWorks(prev => prev.map(w => w.id === updated.id ? updated : w));
                              }}
                              className="w-4 h-4 rounded text-sky-500 bg-slate-900 border-slate-700"
                            />
                            <span>Je lis le manga</span>
                          </label>

                          {showDetailModal.mangaTracking && (
                            <div className="flex items-center gap-2">
                              <span className="text-[10px] text-slate-400">Chapitre</span>
                              <input
                                type="number"
                                min="1"
                                value={showDetailModal.mangaChapter || 1}
                                onChange={(e) => {
                                  const updated = { ...showDetailModal, mangaChapter: parseInt(e.target.value) || 1 };
                                  setShowDetailModal(updated);
                                  setWorks(prev => prev.map(w => w.id === updated.id ? updated : w));
                                }}
                                className="w-16 bg-[#0c1222] border border-slate-700 rounded-lg p-1 text-xs text-white text-center font-bold"
                              />
                            </div>
                          )}
                        </div>
                      )}

                      {/* Saisons / Épisodes (Séries et Animés) */}
                      {(showDetailModal.category === "Séries" || showDetailModal.category === "Animés") && (
                        <div className="grid grid-cols-2 gap-3 mt-3">
                          <div>
                            <label className="text-[10px] font-bold text-slate-400 uppercase">Saison actuelle</label>
                            <input
                              type="number"
                              min="1"
                              value={showDetailModal.currentSeason || 1}
                              onChange={(e) => {
                                const updated = { ...showDetailModal, currentSeason: parseInt(e.target.value) || 1 };
                                setShowDetailModal(updated);
                                setWorks(prev => prev.map(w => w.id === updated.id ? updated : w));
                              }}
                              className="w-full bg-[#07090e] border border-slate-800 rounded-xl p-2 text-xs text-white"
                            />
                          </div>
                          <div>
                            <label className="text-[10px] font-bold text-slate-400 uppercase">Épisode actuel</label>
                            <input
                              type="number"
                              min="1"
                              value={showDetailModal.currentEpisode || 1}
                              onChange={(e) => {
                                const updated = { ...showDetailModal, currentEpisode: parseInt(e.target.value) || 1 };
                                setShowDetailModal(updated);
                                setWorks(prev => prev.map(w => w.id === updated.id ? updated : w));
                              }}
                              className="w-full bg-[#07090e] border border-slate-800 rounded-xl p-2 text-xs text-white"
                            />
                          </div>
                        </div>
                      )}
                    </div>

                    {/* NOTES DÉTAILLÉES (Exactement comme la capture Base44) */}
                    <div className="mt-5 pt-4 border-t border-slate-800">
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-[11px] font-bold uppercase tracking-wider text-slate-300">NOTES DÉTAILLÉES</span>
                        <span className="text-amber-400 font-extrabold text-xs">Moyenne : {showDetailModal.rating || 8}/10</span>
                      </div>

                      <div className="grid grid-cols-5 gap-2">
                        {[
                          { key: "scenario", label: "Scénario" },
                          { key: "visual", label: "Visuel" },
                          { key: "sound", label: "Musique" },
                          { key: "acting", label: "Acteurs" },
                          { key: "emotion", label: "Émotion" }
                        ].map(crit => (
                          <div key={crit.key} className="bg-[#07090e] p-2 rounded-xl border border-slate-800 text-center">
                            <span className="text-[9px] text-slate-400 block truncate">{crit.label}</span>
                            <select
                              value={showDetailModal.detailedRating?.[crit.key] || 8}
                              onChange={(e) => {
                                const val = parseFloat(e.target.value);
                                const newDetails = { ...(showDetailModal.detailedRating || {}), [crit.key]: val };
                                const values = Object.values(newDetails);
                                const avg = (values.reduce((a, b) => a + b, 0) / values.length).toFixed(1);
                                const updated = { ...showDetailModal, detailedRating: newDetails, rating: parseFloat(avg) };
                                setShowDetailModal(updated);
                                setWorks(prev => prev.map(w => w.id === updated.id ? updated : w));
                              }}
                              className="w-full bg-transparent text-center font-bold text-xs text-white mt-1 focus:outline-none"
                            >
                              {[...Array(10)].map((_, i) => (
                                <option key={i+1} value={i+1} className="bg-slate-900">{i+1}</option>
                              ))}
                            </select>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Actions de fermeture et suppression */}
                    <div className="mt-5 pt-3 border-t border-slate-800 flex items-center justify-between">
                      <button
                        onClick={() => {
                          if (confirm("Supprimer cette œuvre de votre liste ?")) {
                            setWorks(prev => prev.filter(w => w.id !== showDetailModal.id));
                            setShowDetailModal(null);
                          }
                        }}
                        className="text-xs text-rose-500 hover:text-rose-400 font-semibold"
                      >
                        <i className="fa-solid fa-trash mr-1"></i> Supprimer de ma liste
                      </button>

                      <button
                        onClick={() => setShowDetailModal(null)}
                        className="px-5 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs transition"
                      >
                        Enregistrer
                      </button>
                    </div>

                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODALE DISCUSSION / TCHAT */}
          {showChatModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0c1222] border border-slate-800 rounded-3xl max-w-lg w-full h-[520px] shadow-2xl flex flex-col overflow-hidden relative">
                <div className="p-4 border-b border-slate-800 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <i className="fa-solid fa-comments text-sky-400"></i>
                    <h3 className="font-bold text-white text-sm">Discussion entre profils</h3>
                  </div>
                  <button onClick={() => setShowChatModal(false)} className="text-slate-400 hover:text-white">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <div className="flex-1 p-4 overflow-y-auto space-y-3 custom-scrollbar">
                  {chatMessages.map(m => {
                    const isMe = m.senderId === currentProfileId;
                    return (
                      <div key={m.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                        <span className="text-[10px] text-slate-500 mb-1">{m.senderName}</span>
                        <div className={`p-3 rounded-2xl text-xs max-w-[80%] ${isMe ? 'bg-sky-500 text-slate-950 font-medium' : 'bg-slate-800 text-slate-200'}`}>
                          {m.text}
                        </div>
                      </div>
                    );
                  })}
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const input = e.target.elements.msg;
                    if (input.value.trim()) {
                      const newMsg = {
                        id: "m_" + Date.now(),
                        senderId: currentProfileId,
                        senderName: currentProfile.name,
                        text: input.value.trim(),
                        timestamp: Date.now()
                      };
                      setChatMessages(prev => [...prev, newMsg]);
                      input.value = "";
                    }
                  }}
                  className="p-3 border-t border-slate-800 flex gap-2"
                >
                  <input
                    name="msg"
                    type="text"
                    placeholder="Écrivez un message..."
                    className="flex-1 bg-[#07090e] border border-slate-800 text-xs rounded-xl px-3 py-2 text-white focus:outline-none focus:border-sky-500"
                  />
                  <button type="submit" className="px-4 py-2 rounded-xl bg-sky-500 text-slate-950 text-xs font-bold">
                    <i className="fa-solid fa-paper-plane"></i>
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
